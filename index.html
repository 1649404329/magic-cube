<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D立体魔方 - 可拖拽旋转 + 自动随机旋转开关</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
        }
        /* UI 面板样式 */
        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            pointer-events: none; /* 让容器不拦截事件，但内部按钮可点 */
        }
        .info-card {
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 8px 16px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            border-left: 3px solid #ff9800;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: none;
            font-family: monospace;
        }
        .btn-auto {
            pointer-events: auto;
            background: rgba(30, 35, 60, 0.85);
            backdrop-filter: blur(8px);
            border: none;
            color: #eee;
            font-size: 15px;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-family: inherit;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-auto:hover {
            background: rgba(50, 60, 90, 0.95);
            transform: scale(1.02);
            border-color: #ff9800;
        }
        .btn-auto:active {
            transform: scale(0.98);
        }
        .btn-auto.active {
            background: #ff9800;
            color: #1e1e2f;
            box-shadow: 0 0 12px rgba(255,152,0,0.5);
            border-color: #ffcc80;
        }
        .status-icon {
            font-size: 18px;
        }
        .controls-tip {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
            font-family: monospace;
            pointer-events: none;
            z-index: 20;
            letter-spacing: 0.5px;
        }
        @media (max-width: 600px) {
            .btn-auto { padding: 6px 14px; font-size: 13px; }
            .info-card { font-size: 10px; padding: 5px 12px; }
            .controls-tip { font-size: 9px; bottom: 12px; right: 12px; }
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <div class="info-card">
            🧩 3D 魔方 | 标准配色
        </div>
        <button id="autoRotateBtn" class="btn-auto">
            <span class="status-icon">🔄</span>
            <span id="btnText">自动旋转 · 关</span>
        </button>
    </div>
    <div class="controls-tip">
        🖱️ 鼠标拖拽旋转视角 | 右键平移 | 滚轮缩放
    </div>

    <!-- 引入Three.js核心库以及扩展 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        scene.fog = new THREE.FogExp2(0x111122, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4.5, 3.5, 5.5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 轨道控制，实现可移动（旋转/缩放/平移）---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.5;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.autoRotate = false;      // 不自动旋转相机，我们旋转魔方本体
        controls.target.set(0, 0, 0);
        
        // --- 辅助元素：网格地板（半透明，辅助空间定位）---
        const gridHelper = new THREE.GridHelper(12, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -2.2;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);
        
        // 极简轴线辅助 (淡色)
        const axesHelper = new THREE.AxesHelper(3.5);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.12;
        scene.add(axesHelper);
        
        // --- 灯光系统：立体感和材质质感 ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.65);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(3, 5, 2);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        
        const backLight = new THREE.DirectionalLight(0xffaa66, 0.5);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);
        
        const fillLight = new THREE.PointLight(0x6688ff, 0.4);
        fillLight.position.set(2, 1, 2.5);
        scene.add(fillLight);
        
        const rimLight = new THREE.PointLight(0xffaa66, 0.35);
        rimLight.position.set(0, -2, 0);
        scene.add(rimLight);
        
        // --- 魔方参数配置 ---
        const cubeSize = 0.96;      // 小块尺寸，留出间隙
        const positions = [-1, 0, 1];
        
        // 六个面标准颜色 (右,左,上,下,前,后)
        const faceColors = {
            right: 0xff6b35,   // 橙
            left: 0xc41e3a,    // 红
            up: 0xeeeeee,      // 白
            down: 0xf3d03e,    // 黄
            front: 0x2e86c1,   // 蓝
            back: 0x2ecc71     // 绿
        };
        
        const innerMaterial = new THREE.MeshStandardMaterial({
            color: 0x222222,
            roughness: 0.4,
            metalness: 0.15,
        });
        
        const matRight = new THREE.MeshStandardMaterial({ color: faceColors.right, roughness: 0.25, metalness: 0.05 });
        const matLeft = new THREE.MeshStandardMaterial({ color: faceColors.left, roughness: 0.25, metalness: 0.05 });
        const matUp = new THREE.MeshStandardMaterial({ color: faceColors.up, roughness: 0.2, metalness: 0.02 });
        const matDown = new THREE.MeshStandardMaterial({ color: faceColors.down, roughness: 0.28, metalness: 0.02 });
        const matFront = new THREE.MeshStandardMaterial({ color: faceColors.front, roughness: 0.25, metalness: 0.05 });
        const matBack = new THREE.MeshStandardMaterial({ color: faceColors.back, roughness: 0.25, metalness: 0.05 });
        
        function getMaterialsForBlock(x, y, z) {
            const mats = [innerMaterial, innerMaterial, innerMaterial, innerMaterial, innerMaterial, innerMaterial];
            if (x === 1) mats[0] = matRight;
            if (x === -1) mats[1] = matLeft;
            if (y === 1) mats[2] = matUp;
            if (y === -1) mats[3] = matDown;
            if (z === 1) mats[4] = matFront;
            if (z === -1) mats[5] = matBack;
            return mats;
        }
        
        const rubikGroup = new THREE.Group();
        
        // 生成27个小块
        for (let i = 0; i < positions.length; i++) {
            const x = positions[i];
            for (let j = 0; j < positions.length; j++) {
                const y = positions[j];
                for (let k = 0; k < positions.length; k++) {
                    const z = positions[k];
                    const materials = getMaterialsForBlock(x, y, z);
                    const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.set(x, y, z);
                    cube.castShadow = true;
                    cube.receiveShadow = false;
                    rubikGroup.add(cube);
                }
            }
        }
        
        scene.add(rubikGroup);
        
        // 装饰性半透明线框外轮廓
        const wireframeBoxGeometry = new THREE.BoxGeometry(3.08, 3.08, 3.08);
        const wireframeEdges = new THREE.EdgesGeometry(wireframeBoxGeometry);
        const wireframeMat = new THREE.LineBasicMaterial({ color: 0x5a7d9a, transparent: true, opacity: 0.2 });
        const wireframe = new THREE.LineSegments(wireframeEdges, wireframeMat);
        rubikGroup.add(wireframe);
        
        // 魔方核心发光小球
        const coreGlow = new THREE.Mesh(
            new THREE.SphereGeometry(0.08, 8, 8),
            new THREE.MeshStandardMaterial({ color: 0xffaa55, emissive: 0x442200, emissiveIntensity: 0.6 })
        );
        rubikGroup.add(coreGlow);
        
        // --- 背景星空粒子 ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100;
            starPositions[i*3+2] = (Math.random() - 0.5) * 80 - 40;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.08, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        function animateStars() {
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            requestAnimationFrame(animateStars);
        }
        animateStars();
        
        // 地面光晕
        const circlePlaneMat = new THREE.MeshStandardMaterial({ color: 0x2266aa, emissive: 0x004466, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
        const groundGlow = new THREE.Mesh(new THREE.CircleGeometry(2.5, 16), circlePlaneMat);
        groundGlow.rotation.x = -Math.PI / 2;
        groundGlow.position.y = -1.85;
        scene.add(groundGlow);
        
        // ========== 自动随机旋转逻辑 ==========
        let autoRotateEnabled = true;      // 默认关闭
        let currentRotAxis = new THREE.Vector3(0, 1, 0);   // 当前旋转轴 (单位向量)
        let currentRotSpeed = 0.003;        // 弧度每帧 (慢速)
        let nextChangeTime = 0;              // 下一次改变方向的时间戳 (毫秒)
        const MIN_CHANGE_INTERVAL = 3500;    // 最小间隔3.5秒
        const MAX_CHANGE_INTERVAL = 7000;    // 最大间隔7秒
        
        // 生成随机的单位向量 (均匀分布在球面上)
        function getRandomUnitVector() {
            // 使用正态分布拒绝采样法或简单立方体归一化 (避免聚集在轴向上，但视觉效果足够随机)
            const x = (Math.random() - 0.5) * 2;
            const y = (Math.random() - 0.5) * 2;
            const z = (Math.random() - 0.5) * 2;
            const len = Math.sqrt(x*x + y*y + z*z);
            if (len < 0.01) return new THREE.Vector3(0, 1, 0); // 容错
            return new THREE.Vector3(x / len, y / len, z / len);
        }
        
        // 生成随机转速 (0.0015 ~ 0.0055 弧度每帧，约0.09~0.31度每帧，60帧约5~18度/秒，很舒缓)
        function getRandomSpeed() {
            return 0.0018 + Math.random() * 0.0042;
        }
        
        // 更新随机旋转参数 (轴和速度)
        function updateRandomRotationParams() {
            if (!autoRotateEnabled) return;
            currentRotAxis = getRandomUnitVector();
            currentRotSpeed = getRandomSpeed();
            // 下一次变更时间 (基于当前时间)
            const interval = MIN_CHANGE_INTERVAL + Math.random() * (MAX_CHANGE_INTERVAL - MIN_CHANGE_INTERVAL);
            nextChangeTime = performance.now() + interval;
            
            // 控制台可查看随机变化 (调试，注释掉以免干扰)
            // console.log(`🔄 旋转方向改变 | 轴: (${currentRotAxis.x.toFixed(2)}, ${currentRotAxis.y.toFixed(2)}, ${currentRotAxis.z.toFixed(2)}) 速度: ${currentRotSpeed.toFixed(4)}`);
        }
        
        // 停止自动旋转时无需额外操作，只需重置计时标记
        function stopAutoRotate() {
            autoRotateEnabled = false;
            nextChangeTime = 0;
        }
        
        // 启动自动旋转 (重置随机参数)
        function startAutoRotate() {
            if (autoRotateEnabled) return;
            autoRotateEnabled = true;
            // 立即随机一个新的方向和速度
            currentRotAxis = getRandomUnitVector();
            currentRotSpeed = getRandomSpeed();
            const interval = MIN_CHANGE_INTERVAL + Math.random() * (MAX_CHANGE_INTERVAL - MIN_CHANGE_INTERVAL);
            nextChangeTime = performance.now() + interval;
        }
        
        // 每帧执行自动旋转 (若启用)
        function applyAutoRotation(nowTime) {
            if (!autoRotateEnabled) return;
            
            // 按照当前轴和速度旋转魔方组 (绕世界轴，视觉效果自然)
            // 使用 rotateOnWorldAxis 让旋转始终相对于世界坐标，避免累积混乱
            rubikGroup.rotateOnWorldAxis(currentRotAxis, currentRotSpeed);
            
            // 检查是否需要改变旋转方向和速度
            if (nowTime >= nextChangeTime) {
                // 生成新的随机轴和速度
                currentRotAxis = getRandomUnitVector();
                currentRotSpeed = getRandomSpeed();
                const interval = MIN_CHANGE_INTERVAL + Math.random() * (MAX_CHANGE_INTERVAL - MIN_CHANGE_INTERVAL);
                nextChangeTime = nowTime + interval;
            }
        }
        
        // --- UI 按钮交互 ---
        const autoBtn = document.getElementById('autoRotateBtn');
        const btnSpan = document.getElementById('btnText');
        
        function updateButtonUI() {
            if (autoRotateEnabled) {
                autoBtn.classList.add('active');
                btnSpan.textContent = '自动旋转 · 开';
                // 改变图标为旋转效果
                const iconSpan = autoBtn.querySelector('.status-icon');
                if (iconSpan) iconSpan.textContent = '⏵';
            } else {
                autoBtn.classList.remove('active');
                btnSpan.textContent = '自动旋转 · 关';
                const iconSpan = autoBtn.querySelector('.status-icon');
                if (iconSpan) iconSpan.textContent = '🔄';
            }
        }
        
        autoBtn.addEventListener('click', () => {
            if (autoRotateEnabled) {
                stopAutoRotate();
            } else {
                startAutoRotate();
            }
            updateButtonUI();
        });
        
        // 默认状态：关闭自动旋转 (符合多数预期)
        updateButtonUI();
        
        // --- 动态光效 & 呼吸核心 ---
        let time = 0;
        
        // 让辅助灯光缓慢变化，增强生动性
        function updateDynamicLights(t) {
            fillLight.intensity = 0.45 + Math.sin(t * 0.7) * 0.05;
            rimLight.intensity = 0.35 + Math.cos(t * 0.5) * 0.08;
            if (coreGlow.material) {
                const intensity = 0.6 + Math.sin(t * 3) * 0.3;
                coreGlow.material.emissiveIntensity = intensity;
            }
        }
        
        // --- 动画循环 ---
        let lastTimestamp = 0;
        
        function animate() {
            const now = performance.now();
            requestAnimationFrame(animate);
            
            time += 0.012;
            updateDynamicLights(time);
            
            // 应用自动旋转 (如果开启)
            applyAutoRotation(now);
            
            // 更新轨道控制 (实现用户交互的平滑)
            controls.update();
            
            // 渲染场景
            renderer.render(scene, camera);
        }
        
        animate();
        
        // --- 窗口自适应 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log('3D魔方已加载 | 点击右下角按钮开启“随机方向自动旋转”，魔方将缓慢自转并随机改变方向');
        
        // 小彩蛋：控制台输出
        const style = "color: #ff9800; font-size: 14px; font-weight: bold;";
        console.log("%c✨ 3D 魔方增强版 | 新增自动随机旋转开关 (默认关闭，点击按钮开启)", style);
    </script>
</body>
</html>
